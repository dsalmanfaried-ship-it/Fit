name: Build and deploy FitMate AI Web

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Organize project files into folders
        run: |
          for z in *.zip; do
            [ -f "$z" ] || continue
            if unzip -l "$z" | grep -q "lib/main.dart"; then
              unzip -oq "$z" -x ".github/*"
              rm -f "$z"
            fi
          done
          mkdir -p lib/models lib/screens lib/services web assets test supabase
          mv_to() { dest="$1"; shift; for f in "$@"; do [ -f "$f" ] && mv -f "$f" "$dest/" || true; done; }
          mv_to lib main.dart app_state.dart
          mv_to lib/models workout.dart
          mv_to lib/screens home_screen.dart account_screen.dart workout_screen.dart
          mv_to lib/services database_service.dart database_service_native.dart database_service_web.dart insights_service.dart online_service.dart supabase_service.dart voice_parser.dart
          mv_to web index.html manifest.json favicon.svg
          mv_to assets exercises.json
          mv_to test widget_test.dart
          mv_to supabase schema.sql
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Organize project files into folders" || true
          git push || true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        continue-on-error: true
        run: flutter test

      - name: Build web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          BASE_HREF="/${REPO_NAME}/"
          if [[ "${REPO_NAME}" == *.github.io ]]; then BASE_HREF="/"; fi
          flutter build web --release --base-href "${BASE_HREF}" \
            --dart-define=SUPABASE_URL="${SUPABASE_URL}" \
            --dart-define=SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

